name: Build and Push to ECR

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TEMP - Debug OIDC token claims
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {req_token}"})
          data = json.loads(urllib.request.urlopen(req).read())
          payload_b64 = data["value"].split(".")[1]
          padded = payload_b64 + "=" * (-len(payload_b64) % 4)
          payload = json.loads(base64.urlsafe_b64decode(padded))
          print(json.dumps(payload, indent=2))
          EOF

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t ${{ vars.ECR_REPOSITORY_URI }}:latest .

      - name: Push image to ECR
        run: docker push ${{ vars.ECR_REPOSITORY_URI }}:latest
